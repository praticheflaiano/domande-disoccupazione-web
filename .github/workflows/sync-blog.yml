name: Sync blog praticheflaiano.it

# Ogni giorno controlla il blog del sito principale: se ci sono nuovi articoli
# su NASpI, disoccupazione o lavoro aggiorna lo snapshot e fa commit su main,
# così Vercel ripubblica il portale con i nuovi link.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-blog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run sync:blog
      - run: npm run test -- --run src/lib/__tests__/blogFlaiano.test.ts
      - name: Commit se ci sono novità
        run: |
          if git diff --quiet -- src/data/blog-flaiano.json; then
            echo "Nessuna novità dal blog."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog-flaiano.json
          git commit -m "Aggiorna i link agli articoli del blog praticheflaiano.it"
          git push
